<title>Convivium — Gastmähler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EAE0C8;
    --parchment-deep:#DED2B4;
    --ink:#2B241C;
    --ink-soft:#5A5040;
    --line:#C9BB98;
    --card:#F3ECD8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(0,0,0,0.035) 0%, transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,0.03) 0%, transparent 45%);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Cormorant Garamond', serif;}
  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.02em;}
  #app{max-width:640px; margin:0 auto; padding:0 0 60px;}

  /* ---- Header ---- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--parchment);
    border-bottom:1px solid var(--line);
    padding:18px 20px 14px;
    display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink);
    width:36px; height:36px; border-radius:50%; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .topbar-title{font-size:22px; font-weight:600; line-height:1.1;}
  .topbar-sub{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}

  /* ---- Home ---- */
  .home-hero{padding:28px 24px 8px;}
  .home-hero .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .home-hero h1{font-size:38px; margin:6px 0 4px; font-weight:700;}
  .home-hero p{color:var(--ink-soft); font-size:16px; margin:0 0 10px; max-width:44ch;}

  .menu-list{padding:6px 20px 20px; display:flex; flex-direction:column; gap:14px;}
  .menu-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 18px 16px;
    position:relative;
    cursor:pointer;
    display:flex; gap:16px; align-items:center;
    transition:transform .15s ease;
  }
  .menu-card:active{transform:scale(0.98);}
  .menu-card::before{
    content:'';
    position:absolute; left:0; top:10px; bottom:10px; width:3px;
    background:var(--accent, #8B5E34);
  }
  .menu-card .seal{
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--accent, #8B5E34);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:500;
    color:var(--accent, #8B5E34); flex-shrink:0;
    background:
      conic-gradient(var(--accent, #8B5E34) calc(var(--pct,0)*1%), transparent 0);
    position:relative;
  }
  .menu-card .seal::after{
    content:''; position:absolute; inset:4px; border-radius:50%; background:var(--card);
  }
  .menu-card .seal span{position:relative; z-index:1;}
  .menu-card .meta{flex:1; min-width:0;}
  .menu-card .era{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--accent, #8B5E34); margin-bottom:3px;
  }
  .menu-card h3{margin:0 0 2px; font-size:21px; font-weight:600; line-height:1.15;}
  .menu-card .sub{font-size:13.5px; color:var(--ink-soft); margin:0;}

  /* ---- Detail ---- */
  .settings-bar{
    display:flex; gap:10px; margin:16px 20px 0; padding:12px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:2px;
  }
  .settings-field{flex:1; display:flex; flex-direction:column; gap:4px;}
  .settings-field label{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .settings-field input{
    border:1px solid var(--line); background:var(--parchment); color:var(--ink);
    font-family:'JetBrains Mono', monospace; font-size:15px; padding:7px 8px; border-radius:2px;
    width:100%;
  }
  .settings-field input:focus{outline:none; border-color:var(--accent, #8B5E34);}
  .settings-note{
    margin:6px 20px 0; font-size:12px; color:var(--ink-soft); font-style:italic;
  }

  .quote-block{
    margin:18px 20px 6px; padding:14px 16px;
    border-left:2px solid var(--accent, #8B5E34);
    font-style:italic; color:var(--ink-soft); font-size:15.5px;
  }
  .tabs{display:flex; margin:16px 20px 4px; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .tab{
    flex:1; text-align:center; padding:10px 2px; font-size:10.5px;
    font-family:'JetBrains Mono', monospace; letter-spacing:0.01em;
    text-transform:uppercase; cursor:pointer; color:var(--ink-soft);
    background:var(--parchment);
  }
  .tab.active{background:var(--accent, #8B5E34); color:#F3ECD8;}

  .section-block{padding:8px 20px 4px;}
  .dish-block{
    margin:14px 0; padding:14px 16px; background:var(--card);
    border:1px solid var(--line); border-radius:2px;
  }
  .dish-block h4{margin:0 0 8px; font-size:18px; font-weight:600;}
  .ingredients{font-size:13.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}

  .step-row{
    display:flex; gap:10px; padding:8px 0; align-items:flex-start;
    border-top:1px solid var(--line);
  }
  .step-row:first-of-type{border-top:none;}
  .checkbox{
    width:22px; height:22px; border:1.5px solid var(--accent, #8B5E34);
    border-radius:50%; flex-shrink:0; margin-top:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--parchment);
  }
  .checkbox.done{background:var(--accent, #8B5E34);}
  .checkbox.done::after{content:'✓'; color:#F3ECD8; font-size:13px; line-height:1;}
  .step-text{font-size:15.5px; line-height:1.4; cursor:pointer;}
  .step-text.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

  .timeline-row{
    display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--line);
  }
  .timeline-row:first-of-type{border-top:none;}
  .time-mark{
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:500;
    color:var(--accent, #8B5E34); width:44px; flex-shrink:0; padding-top:1px;
  }
  .timeline-body{flex:1;}
  .timeline-body h5{margin:0 0 3px; font-size:16.5px; font-weight:600;}
  .timeline-body p{margin:0; font-size:14.5px; color:var(--ink-soft); line-height:1.42;}
  .timeline-row.done .timeline-body h5,
  .timeline-row.done .timeline-body p{color:var(--line);}
  .timeline-row.done .time-mark{color:var(--line);}

  .focus-card{
    margin:20px; padding:26px 22px; background:var(--card);
    border:1px solid var(--line); border-radius:2px; text-align:center;
  }
  .focus-card .fcount{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.12em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:10px;
  }
  .focus-card .ftime{
    font-family:'JetBrains Mono', monospace; font-size:15px; color:var(--accent,#8B5E34);
    margin-bottom:6px;
  }
  .focus-card h3{margin:0 0 10px; font-size:24px;}
  .focus-card p{font-size:16px; color:var(--ink-soft); line-height:1.5; margin:0 0 22px;}
  .focus-nav{display:flex; gap:10px; justify-content:center;}
  .btn{
    border:1px solid var(--accent,#8B5E34); background:none; color:var(--accent,#8B5E34);
    padding:11px 20px; border-radius:2px; font-family:'JetBrains Mono',monospace;
    font-size:13px; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
  }
  .btn.primary{background:var(--accent,#8B5E34); color:#F3ECD8;}
  .btn:disabled{opacity:0.35; cursor:default;}

  .score-badge{
    display:inline-flex; align-items:center; gap:6px;

function shareOrCopy(title, text){
  return new Promise(async (resolve)=>{
    if(navigator.share){
      try{
        await navigator.share({title, text});
        resolve('shared'); return;
      }catch(e){
        if(e && e.name==='AbortError'){ resolve('aborted'); return; }
        // sonst: weiter zu den Fallbacks
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(text);
        resolve('copied'); return;
      }catch(e){ /* weiter zum nächsten Fallback */ }
    }
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok){ resolve('copied'); return; }
    }catch(e){ /* weiter zum Modal */ }
    showTextModal(title, text);
    resolve('modal');
  });
}

function showTextModal(title, text){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const h4 = document.createElement('h4'); h4.textContent = title;
  const hint = document.createElement('p'); hint.className = 'modal-hint';
  hint.textContent = 'Automatisches Teilen/Kopieren ist hier nicht verfügbar — Text unten antippen, alles markieren (lange drücken → Alles auswählen) und kopieren.';
  const ta = document.createElement('textarea');
  ta.readOnly = true; ta.value = text;
  const actions = document.createElement('div'); actions.className = 'modal-actions';
  const closeBtn = document.createElement('button'); closeBtn.className = 'btn'; closeBtn.textContent = 'Fertig';
  actions.appendChild(closeBtn);
  box.appendChild(h4); box.appendChild(hint); box.appendChild(ta); box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  ta.focus(); ta.select();
  closeBtn.addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

// ---------- Fokus-Timer ----------
let timerState = { key:null, remaining:0, total:0, handle:null };

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    osc.start();
    osc.stop(ctx.currentTime+0.6);
  }catch(e){ /* Audio nicht verfügbar */ }
}

function stopTimer(){
  if(timerState.handle) clearInterval(timerState.handle);
  timerState = { key:null, remaining:0, total:0, handle:null };
}

function startTimer(key, minutes, label){
  stopTimer();
  timerState.key = key;
  timerState.total = minutes*60;
  timerState.remaining = minutes*60;
  timerState.handle = setInterval(()=>{
    timerState.remaining -= 1;
    if(timerState.remaining <= 0){
      clearInterval(timerState.handle);
      timerState.remaining = 0;
      timerState.handle = null;
      beep();
      if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Timer fertig', {body:label}); }catch(e){}
      }
    }
    render();
  }, 1000);
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  render();
}

function formatTimer(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ---------- Alarme als Kalenderdatei (.ics) ----------
function icsEscape(text){
  return String(text).replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g, '\\n');
}
function icsDateStamp(date){
  const pad = n=>String(n).padStart(2,'0');
  return date.getFullYear()+pad(date.getMonth()+1)+pad(date.getDate())+'T'+pad(date.getHours())+pad(date.getMinutes())+'00';
}
function generateICS(menu, offset){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Convivium//Gastmahl//DE\r\nCALSCALE:GREGORIAN\r\n';
  menu.timeline.forEach((row, i)=>{
    const t = shiftTime(row.t, offset);
    const [h,m] = t.split(':').map(Number);
    const start = new Date(base); start.setHours(h,m,0,0);
    const end = new Date(start.getTime() + 15*60000);
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:'+menu.id+'-'+i+'-'+start.getTime()+'@convivium\r\n';
    ics += 'DTSTAMP:'+icsDateStamp(now)+'\r\n';
    ics += 'DTSTART:'+icsDateStamp(start)+'\r\n';
    ics += 'DTEND:'+icsDateStamp(end)+'\r\n';
    ics += 'SUMMARY:'+icsEscape(menu.title+' — '+row.h)+'\r\n';
    ics += 'DESCRIPTION:'+icsEscape(row.p)+'\r\n';
    ics += 'BEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEscape(row.h)+'\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  return ics;
}
function downloadICS(menu, offset){
  const ics = generateICS(menu, offset);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'convivium-'+menu.id+'.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- Personen- und Zeit-Skalierung ----------
function formatNum(n){
  let v;
  if(n>=100) v = Math.round(n/5)*5;
  else if(n>=10) v = Math.round(n);
  else if(n>=1) v = Math.round(n*2)/2;
  else v = Math.round(n*4)/4;
  if(Number.isInteger(v)) return String(v);
  return String(v).replace('.', ',');
}

function scaleSegment(seg, factor){
  const re = /(\d+(?:[.,]\d+)?)(\s*[–-]\s*(\d+(?:[.,]\d+)?))?/;
  const m = re.exec(seg);
  if(!m) return seg;
  const toNum = s => parseFloat(s.replace(',', '.'));
  const n1 = toNum(m[1]);
  if(m[3]){
    const n2 = toNum(m[3]);
    const s1 = formatNum(n1*factor);
    const s2 = formatNum(n2*factor);
    return seg.slice(0, m.index) + s1 + '–' + s2 + seg.slice(m.index+m[0].length);
  }
  const s1 = formatNum(n1*factor);
  return seg.slice(0, m.index) + s1 + seg.slice(m.index+m[0].length);
}

function scaleIngredientLine(line, factor){
  if(factor===1) return line;
  return line.split('·').map(seg=>scaleSegment(seg.trim(), factor)).join(' · ');
}

function parseTimeStr(str){
  const [h,m] = str.split(':').map(Number);
  return h*60+m;
}
function formatTimeMins(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function shiftTime(t, offset){
  if(offset===0) return t;
  return formatTimeMins(parseTimeStr(t)+offset);
}

function totalSteps(menu){
  let n = 0;
  menu.prep.forEach(d=> n += d.steps.length);
  n += menu.timeline.length;
  return n;
}

function allFocusSteps(menu){
  // flatten: prep steps first, then timeline, each with metadata
  const arr = [];
  menu.prep.forEach((d, di)=>{
    d.steps.forEach((s, si)=>{
      arr.push({key:stepKey(menu.id,'vortag',si,di), title:d.dish, text:s, time:null, phase:'vortag'});
    });
  });
  menu.timeline.forEach((row, ti)=>{
    arr.push({key:stepKey(menu.id,'tag',ti), title:row.h, text:row.p, time:row.t, phase:'tag', dur:row.dur||null});
  });
  return arr;
}

async function toggleStep(menu, key){
  const set = await loadProgress(menu.id);
  if(set.has(key)) set.delete(key); else set.add(key);
  await saveProgress(menu.id);
  render();
}

function pctFor(menu){
  const set = progressCache[menu.id];
  if(!set) return 0;
  const total = totalSteps(menu);
  return total ? Math.round((set.size/total)*100) : 0;
}

      const id = card.dataset.menu;
      await Promise.all([loadProgress(id), loadSettings(id), loadShopping(id)]);
      state.view='detail'; state.menuId=id; state.tab='vortag'; state.focusIdx=0;
      render();
    });
  });
}

function renderDetail(){
  const menu = MENUS.find(m=>m.id===state.menuId);
  const set = progressCache[menu.id] || new Set();
  const settings = settingsCache[menu.id] || {personen:BASE_PERSONEN, essenzeit:BASE_ESSENZEIT};
  const pct = pctFor(menu);
  const factor = settings.personen / BASE_PERSONEN;
  const offset = parseTimeStr(settings.essenzeit) - parseTimeStr(BASE_ESSENZEIT);

  let html = `
    <div class="topbar" style="--accent:${menu.accent}">
      <button class="back-btn" id="backBtn">‹</button>
      <div style="flex:1;">
        <div class="topbar-title">${menu.title}</div>
        <div class="topbar-sub">${menu.era} · ${pct}% erledigt</div>
      </div>
      <button class="btn" id="guestModeBtn" style="border-color:${menu.accent}; color:${menu.accent}; padding:8px 12px; font-size:11px;">Gäste-Ansicht</button>
    </div>
    <div class="settings-bar" style="--accent:${menu.accent}">
      <div class="settings-field">
        <label for="personenInput">Personen</label>
        <input type="number" id="personenInput" min="1" max="60" value="${settings.personen}">
      </div>
      <div class="settings-field">
        <label for="essenzeitInput">Essenzeit</label>
        <input type="time" id="essenzeitInput" value="${settings.essenzeit}">
      </div>
    </div>
    <div class="settings-note">Basis laut Originalrezept: ${BASE_PERSONEN} Personen, Essenzeit ${BASE_ESSENZEIT} Uhr. Mengen und Zeitplan passen sich an.</div>
    <div class="quote-block" style="--accent:${menu.accent}">${menu.quote}</div>
    <div class="tabs">
      <div class="tab ${state.tab==='vortag'?'active':''}" data-tab="vortag" style="${state.tab==='vortag'?`background:${menu.accent}`:''}">Vortag</div>
      <div class="tab ${state.tab==='tag'?'active':''}" data-tab="tag" style="${state.tab==='tag'?`background:${menu.accent}`:''}">Zeitplan</div>
      <div class="tab ${state.tab==='focus'?'active':''}" data-tab="focus" style="${state.tab==='focus'?`background:${menu.accent}`:''}">Fokus</div>
      <div class="tab ${state.tab==='einkauf'?'active':''}" data-tab="einkauf" style="${state.tab==='einkauf'?`background:${menu.accent}`:''}">Einkauf</div>
      <div class="tab ${state.tab==='quellen'?'active':''}" data-tab="quellen" style="${state.tab==='quellen'?`background:${menu.accent}`:''}">Quellen</div>
    </div>
  `;

  if(state.tab==='vortag'){
    html += `<div class="section-block" style="--accent:${menu.accent}">`;
    menu.prep.forEach((d, di)=>{
      html += `<div class="dish-block"><h4>${d.dish}</h4><p class="ingredients">${scaleIngredientLine(d.ing, factor)}</p>`;
      d.steps.forEach((s, si)=>{
        const key = stepKey(menu.id,'vortag',si,di);
        const done = set.has(key);
        html += `
          <div class="step-row">
            <div class="checkbox ${done?'done':''}" data-key="${key}" style="--accent:${menu.accent}"></div>
            <div class="step-text ${done?'done':''}" data-key="${key}">${s}</div>
          </div>
        `;
      });
      html += `</div>`;
    });
    html += `</div>`;
  } else if(state.tab==='tag'){
    html += `<div class="section-block" style="--accent:${menu.accent}">`;
    menu.timeline.forEach((row, ti)=>{
      const key = stepKey(menu.id,'tag',ti);
      const done = set.has(key);
      html += `
        <div class="timeline-row ${done?'done':''}" data-key="${key}" style="cursor:pointer;">
          <div class="time-mark">${shiftTime(row.t, offset)}</div>
          <div class="timeline-body">
            <h5>${row.h}</h5>
            <p>${row.p}</p>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    html += `
      <div class="ics-row">
        <button class="btn" id="icsBtn" style="width:100%; border-color:${menu.accent}; color:${menu.accent};">Alarme im Kalender anlegen</button>
        <div class="settings-note" style="margin:8px 0 0;">Lädt eine Kalenderdatei mit Erinnerung zu jedem Schritt herunter — dein Handy kann keine echten System-Alarme direkt aus dem Browser stellen, aber der Kalender benachrichtigt dich zuverlässig zur richtigen Zeit.</div>
      </div>
    `;
  } else if(state.tab==='focus'){
    const steps = allFocusSteps(menu);
    // find first not-done starting from focusIdx, else stay
    let idx = Math.min(state.focusIdx, steps.length-1);
    if(idx<0) idx=0;
    const cur = steps[idx];
    const done = cur ? set.has(cur.key) : false;
    if(steps.length===0){
      html += `<div class="focus-card">Keine Schritte vorhanden.</div>`;
    } else {
      const timerActive = timerState.key===cur.key;
      html += `
        <div class="focus-card" style="--accent:${menu.accent}">
          <div class="fcount">Schritt ${idx+1} / ${steps.length} · ${cur.phase==='vortag' ? 'Am Vortag' : 'Am Tag'}</div>
          ${cur.time ? `<div class="ftime">${shiftTime(cur.time, offset)} Uhr</div>` : ''}
          <h3>${cur.title}</h3>
          <p>${cur.text}</p>
          ${cur.dur ? (
            timerActive
              ? `<div class="timer-display">${formatTimer(timerState.remaining)}</div>
                 <div class="focus-nav" style="margin-bottom:16px;">
                   <button class="btn" id="stopTimerBtn">Timer stoppen</button>
                 </div>`
              : `<div class="focus-nav" style="margin-bottom:16px;">
                   <button class="btn" id="startTimerBtn" style="border-color:${menu.accent}; color:${menu.accent};">Timer starten (${cur.dur} Min)</button>
                 </div>`
          ) : ''}
          <div class="focus-nav">
            <button class="btn" id="prevBtn" ${idx===0?'disabled':''}>‹ Zurück</button>
            <button class="btn primary" id="doneBtn" style="background:${menu.accent}; border-color:${menu.accent}">${done?'✓ Erledigt':'Erledigt'}</button>
            <button class="btn" id="nextBtn" ${idx===steps.length-1?'disabled':''}>Weiter ›</button>
          </div>
        </div>
      `;
    }
  } else if(state.tab==='einkauf'){
    const shopSet = shoppingCache[menu.id] || new Set();
    const groups = shoppingList(menu, factor);
    html += `<div class="section-block" style="--accent:${menu.accent}">`;
    groups.forEach(g=>{
      html += `<div class="dish-block"><h4>${g.dish}</h4>`;
      g.items.forEach(item=>{
        const done = shopSet.has(item.key);
        html += `
          <div class="step-row">
            <div class="checkbox shop-checkbox ${done?'done':''}" data-key="${item.key}" style="--accent:${menu.accent}"></div>
            <div class="step-text shop-text ${done?'done':''}" data-key="${item.key}">${item.text}</div>
          </div>
        `;
      });
      html += `</div>`;
    });
    html += `</div>
      <div class="settings-note" style="margin-top:2px;">Mengen sind je Gericht aufgeführt — gleiche Zutaten aus mehreren Gerichten ggf. addieren.</div>`;
  } else if(state.tab==='quellen'){
    html += `<div class="section-block" style="--accent:${menu.accent}">
      <div class="score-badge">Quellenlage · ${menu.score}</div>
      <p style="font-size:15px; color:var(--ink-soft); line-height:1.5; margin:0 0 6px;">${menu.sourceSummary}</p>
      <div class="legend">
        <div class="legend-item"><div class="tier-dot belegt"></div><div><strong>Quellenbelegt</strong> — durch ein historisches Kochbuch, einen Text oder einen archäologischen Fund direkt überliefert.</div></div>
        <div class="legend-item"><div class="tier-dot plausibel"></div><div><strong>Archäologisch plausibel</strong> — Zutaten und Zubereitung belegt, die genaue Rezeptur ist rekonstruiert.</div></div>
        <div class="legend-item"><div class="tier-dot rekonstruktion"></div><div><strong>Moderne Rekonstruktion</strong> — schließt eine Überlieferungslücke mit einer zeittypischen, begründeten Annahme.</div></div>
      </div>
      <div class="dish-block">`;
    menu.sources.forEach(s=>{
      html += `
        <div class="source-item">
          <div class="tier-dot ${s.tier}"></div>
          <div><h5>${s.dish}</h5><p>${s.note}</p></div>
        </div>
      `;
    });
    html += `</div>
      <div class="settings-note" style="margin-top:10px;">Einschätzungen nach bestem Wissen, keine akademische Quellenkritik.</div>
    </div>`;
  }

  html += `
    <div class="actions-row">
      ${state.tab==='einkauf'
        ? `<button class="btn" id="copyListBtn">Liste kopieren</button><button class="btn" id="resetShopBtn">Einkaufsliste zurücksetzen</button>`
        : state.tab==='quellen' ? ''
        : `<button class="btn" id="resetBtn">Fortschritt zurücksetzen</button>`}
    </div>
  `;

  appEl.innerHTML = html;

  document.getElementById('backBtn').addEventListener('click', ()=>{
    state.view='home'; render();
  });
  const guestModeBtn = document.getElementById('guestModeBtn');
  if(guestModeBtn) guestModeBtn.addEventListener('click', ()=>{
    state.view='guest'; render();
  });
  const icsBtn = document.getElementById('icsBtn');
  if(icsBtn) icsBtn.addEventListener('click', ()=> downloadICS(menu, offset));
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      state.tab = t.dataset.tab; render();
    });
  });
  document.querySelectorAll('.checkbox:not(.shop-checkbox), .step-text:not(.shop-text)').forEach(el=>{
    el.addEventListener('click', ()=> toggleStep(menu, el.dataset.key));
  });
  document.querySelectorAll('.shop-checkbox, .shop-text').forEach(el=>{
    el.addEventListener('click', ()=> toggleShoppingItem(menu, el.dataset.key));
  });
  document.querySelectorAll('.timeline-row').forEach(el=>{
    el.addEventListener('click', ()=> toggleStep(menu, el.dataset.key));
  });
  const personenInput = document.getElementById('personenInput');
  const essenzeitInput = document.getElementById('essenzeitInput');
  if(personenInput) personenInput.addEventListener('change', async (e)=>{
    let v = parseInt(e.target.value, 10);
    if(!v || v<1) v = 1;
    if(v>60) v = 60;
    settingsCache[menu.id].personen = v;
    await saveSettings(menu.id);
    render();
  });
  if(essenzeitInput) essenzeitInput.addEventListener('change', async (e)=>{
    settingsCache[menu.id].essenzeit = e.target.value || BASE_ESSENZEIT;
    await saveSettings(menu.id);
    render();
  });
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    progressCache[menu.id] = new Set();
    await saveProgress(menu.id);
    render();
  });
  const resetShopBtn = document.getElementById('resetShopBtn');
  if(resetShopBtn) resetShopBtn.addEventListener('click', async ()=>{
    shoppingCache[menu.id] = new Set();
    await saveShopping(menu.id);
    render();
  });
  const copyListBtn = document.getElementById('copyListBtn');
  if(copyListBtn) copyListBtn.addEventListener('click', async ()=>{
    const groups = shoppingList(menu, factor);
    let text = `Einkaufsliste — ${menu.title} (${settings.personen} Personen)\n\n`;
    groups.forEach(g=>{
      text += `${g.dish}\n`;
      g.items.forEach(item=> text += `- ${item.text}\n`);
      text += '\n';
    });
    const result = await shareOrCopy('Einkaufsliste — '+menu.title, text);
    if(result==='copied' || result==='shared'){
      copyListBtn.textContent = 'Kopiert ✓';
      setTimeout(()=>{ copyListBtn.textContent = 'Liste kopieren'; }, 1800);
    }
  });

  if(state.tab==='focus'){
    const steps = allFocusSteps(menu);
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const doneBtn = document.getElementById('doneBtn');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const stopTimerBtn = document.getElementById('stopTimerBtn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ state.focusIdx = Math.max(0, state.focusIdx-1); render(); });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ state.focusIdx = Math.min(steps.length-1, state.focusIdx+1); render(); });
    if(doneBtn) doneBtn.addEventListener('click', async ()=>{
      const idx = Math.min(state.focusIdx, steps.length-1);
      const cur = steps[idx];
      await toggleStep(menu, cur.key);
      if(idx < steps.length-1){ state.focusIdx = idx+1; render(); }
    });
    if(startTimerBtn) startTimerBtn.addEventListener('click', ()=>{
      const idx = Math.min(state.focusIdx, steps.length-1);
      const cur = steps[idx];
      startTimer(cur.key, cur.dur, menu.title+' — '+cur.title);
    });
    if(stopTimerBtn) stopTimerBtn.addEventListener('click', ()=>{ stopTimer(); render(); });
  }
}

function renderGuest(){
  const menu = MENUS.find(m=>m.id===state.menuId);
  const settings = settingsCache[menu.id] || {personen:BASE_PERSONEN, essenzeit:BASE_ESSENZEIT};
  const offset = parseTimeStr(settings.essenzeit) - parseTimeStr(BASE_ESSENZEIT);
  const mealTime = shiftTime('16:00', offset);
  const numerals = ['I','II','III','IV','V','VI'];

  let html = `
    <div class="topbar" style="--accent:${menu.accent}">
      <button class="back-btn" id="backBtn">‹</button>
      <div><div class="topbar-title">Gäste-Ansicht</div><div class="topbar-sub">${menu.era}</div></div>
    </div>
    <div class="guest-page" style="--accent:${menu.accent}">
      <div class="era">${menu.era} · Essenzeit ${mealTime} Uhr</div>
      <h1>${menu.title}</h1>
      <p class="sub">${menu.sub}</p>
      <div class="guest-divider"></div>
  `;
  menu.courses.forEach((c, i)=>{
    html += `
      <div class="guest-course">
        <div class="num">${numerals[i]||(i+1)}</div>
        <h3>${c.name}</h3>
        <p>${c.desc}</p>
      </div>
    `;
  });
  html += `
      <div class="guest-quote">${menu.quote}</div>
      <div class="guest-actions">
        <button class="btn" id="shareBtn" style="border-color:${menu.accent}; color:${menu.accent};">Teilen</button>
      </div>
    </div>
  `;
  appEl.innerHTML = html;

  document.getElementById('backBtn').addEventListener('click', ()=>{
    state.view='detail'; render();
  });
  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn) shareBtn.addEventListener('click', async ()=>{
    let text = `${menu.title}\n${menu.sub}\n\n`;
    menu.courses.forEach((c,i)=>{ text += `${numerals[i]||(i+1)}. ${c.name} — ${c.desc}\n`; });
    text += `\nEssenzeit: ${mealTime} Uhr`;
    const result = await shareOrCopy(menu.title, text);
    if(result==='copied'){
      shareBtn.textContent = 'Kopiert ✓';
      setTimeout(()=>{ shareBtn.textContent = 'Teilen'; }, 1800);
    }
  });
}

function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='guest') renderGuest();
  else renderDetail();
}

render();
</script>
</body>
</html>
